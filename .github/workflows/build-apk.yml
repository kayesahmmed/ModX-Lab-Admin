name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "399055351822",
              "firebase_url": "https://kayes-ahmmed-pro-default-rtdb.firebaseio.com",
              "project_id": "kayes-ahmmed-pro",
              "storage_bucket": "kayes-ahmmed-pro.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:399055351822:android:53d489b58bb37ea02f4c5f",
                  "android_client_info": {
                    "package_name": "com.kayesahmmed.admin"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "399055351822-kb4tgtvrp74tvqt5e5ug1dv20h0ipm80.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDsq6vR-qM1tVCJWWiUyZQWQW-TT-CPbfQ"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "399055351822-kb4tgtvrp74tvqt5e5ug1dv20h0ipm80.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:399055351822:android:8b22002a579b7b942f4c5f",
                  "android_client_info": {
                    "package_name": "com.kayesahmmed.pro"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "399055351822-kb4tgtvrp74tvqt5e5ug1dv20h0ipm80.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDsq6vR-qM1tVCJWWiUyZQWQW-TT-CPbfQ"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "399055351822-kb4tgtvrp74tvqt5e5ug1dv20h0ipm80.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModX-Admin-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

